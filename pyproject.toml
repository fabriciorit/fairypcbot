[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairypcbot"
version = "0.1.0"
description = "Intent-driven PCB design framework with formal validation and domain-based placement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2",
    "ruamel.yaml",
    "typer>=0.12",
    "rich",
    "jinja2",
    "svgwrite",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
fairypcbot = "fairypcbot.cli:app"
fae = "fairypcbot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fairypcbot"]

[tool.hatch.build.targets.wheel.force-include]
"docs/llm" = "fairypcbot/docs/llm"
"docs/skill" = "fairypcbot/docs/skill"
"library" = "fairypcbot/library"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["fairypcbot.schemas.*", "fairypcbot.registry.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
