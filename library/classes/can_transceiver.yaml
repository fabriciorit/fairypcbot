fairypcbot: "0.1"
kind: component_class
id: can_transceiver
pins:
  - {role: vcc}
  - {role: gnd}
  - {role: tx}
  - {role: rx}
  - {role: canh}
  - {role: canl}
params:
  required: []
  optional: []
models: {}
rules: []
application_circuit:
  parts:
    C_VCC: {class: capacitor, sizing: mcu.decoupling_sizing}
  nets_internal: []
