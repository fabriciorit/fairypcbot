name: Bug Report
description: Create a report to help us improve fairypcbot
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug? Please provide the exact commands and intent files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Please include terminal output and error traces.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fairypcbot version
      description: Output of `fae --version`
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: e.g. Python 3.11.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Ubuntu 22.04, macOS 14.0, Windows 11
    validations:
      required: true
