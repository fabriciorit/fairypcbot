fairypcbot: "0.1"
kind: board
name: metal_detector_bfo
description: >
  Fully analog BFO (Beat-Frequency Oscillator) metal detector. Two Colpitts oscillators (~225kHz):
  one uses an external search coil (L1, hand-wound, estimated 100µH, connected via J1 — the coil
  itself is NOT on the board, see placement_hints), the other has a fixed reference inductor (L2)
  and an adjustment trimmer (CT1). The frequency difference between the two, generated by the
  diode mixer (D1), becomes an audible tone — metal near the search coil shifts the frequency
  and changes the tone. An RC filter extracts the audio band; LM386 (U1) amplifies for the
  speaker. LM386 gain left at default (20x/26dB, GAIN pins open).

  WARNING: tuning values for the oscillators (C1/C2/C3/C4) are design estimates for ~225kHz
  with L~100µH — the actual frequency depends on the hand-wound search coil and must be adjusted
  on the bench via CT1. The framework does not simulate the circuit (no SPICE, by design) — it
  validates connectivity, electrical budget, and placement, not oscillation behavior.

  Design notes: the -INPUT of the LM386 is grounded (datasheet indicates ~12.5 mV internal bias
  if left open — grounding is preferred when the source impedance at +INPUT is uncertain). C7
  (bypass) is 10 µF, matching the PSRR test condition in the datasheet. A Zobel network (R7+C12)
  stabilizes the output. C13/C14 provide base bypass for Q1/Q2 (the Colpitts topology with
  collector-emitter feedback requires AC ground at the base). R6 supplies a DC return path for
  the mixer. Off-board components connect via JST headers: search coil L1 via J1, speaker SPK1
  via J2, battery BAT1 via J3.

board:
  layers: 2
  # Automatic outline — no fixed enclosure defined for this prototype; the placer discovers the
  # smallest 4:3 rect that accommodates the layout. No mounting holes (would require explicit
  # outline constraints from a real enclosure).

parts:
  # --- Semiconductors (via catalog fetch, real geometry from EasyEDA API) ---
  Q1: {part: "lcsc:C2942489"}    # BC847BWQ SOT-323 — search oscillator (was BC547 TO-92)
  Q2: {part: "lcsc:C2942489"}    # BC847BWQ SOT-323 — reference oscillator
  D1: {part: "lcsc:C779738"}     # 1N4148WS SOD-323 — mixer (was 1N4148 DO-35)
  U1: {part: "lcsc:C22438596"}   # LM386M-1 — audio amplifier (real datasheet ingested)
  L2: {part: "lcsc:C2929436"}    # 100µH fixed inductor — reference oscillator tank

  # --- External search coil: L1 is off_board (see placement_hints) — J1 is on the board ---
  L1:
    class: inductor.power
    params: {inductance_h: 1.0e-4, i_sat_a: 1.0, dcr_ohm: 5.0}
  J1: {part: "lcsc:C295747", params: {pitch_mm: 2.0}}  # JST PH 2P SMD — search coil terminal

  # --- Passives (reuse from fairypcbot founding library, values per instance) ---
  C1: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-8}}   # 10nF — search tank (Colpitts div.)
  C2: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-8}}   # 10nF — search tank (Colpitts div.)
  C3: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-8}}   # 10nF — reference tank
  C4: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-8}}   # 10nF — reference tank
  C5: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-8}}   # 10nF — low-pass filter (audio)
  C6: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-7}}   # 100nF — LM386 input coupling
  C7:                                                          # 10µF — LM386 bypass (corrected: was 50nF)
    part: "lcsc:C5240379"                                      # 10µF 25V X5R 0805 (SMD ceramic)
    params: {capacitance_f: 1.0e-5}
  C8:                                                          # 220µF ≈ 250µF from datasheet (closest E12)
    part: "lcsc:C48970601"                                     # 220µF 25V SMD 6.3mm (HONOR)
    params: {capacitance_f: 2.2e-4, voltage_rating_v: 25}
  C9: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-10}}  # 100pF — mixer coupling (search)
  C10: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-10}} # 100pF — mixer coupling (reference)
  C11:                                                         # 100µF — power supply decoupling
    part: "lcsc:C51953428"                                     # RVT16V100M5X5 — 100µF 16V SMD 5x5
    params: {capacitance_f: 1.0e-4, voltage_rating_v: 16}
  C12: {part: "lcsc:C1525", params: {capacitance_f: 5.0e-8}}  # 50nF — Zobel network (with R7)
  C13: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-7}}  # 100nF — Q1 base bypass
  C14: {part: "lcsc:C1525", params: {capacitance_f: 1.0e-7}}  # 100nF — Q2 base bypass

  CT1:
    part: "lcsc:C19612851"                                     # TZC3Z030A110B00 — 6-30pF SMD trimmer (Murata)
    params: {capacitance_min_f: 6.0e-12, capacitance_max_f: 3.0e-11}

  R1: {part: "lcsc:C25804", params: {resistance_ohm: 100000}}  # 100k — Q1 base bias
  R1B: {part: "lcsc:C25804", params: {resistance_ohm: 22000}}  # 22k — Q1 base divider
  R2: {part: "lcsc:C25804", params: {resistance_ohm: 1000}}    # 1k — Q1 emitter resistor
  R3: {part: "lcsc:C25804", params: {resistance_ohm: 100000}}  # 100k — Q2 base bias
  R3B: {part: "lcsc:C25804", params: {resistance_ohm: 22000}}  # 22k — Q2 base divider
  R4: {part: "lcsc:C25804", params: {resistance_ohm: 1000}}    # 1k — Q2 emitter resistor
  R5: {part: "lcsc:C25804", params: {resistance_ohm: 10000}}   # 10k — low-pass filter (audio)
  R6: {part: "lcsc:C25804", params: {resistance_ohm: 100000}}  # 100k — mixer DC return
  R7: {part: "lcsc:C25804", params: {resistance_ohm: 10}}      # 10R — Zobel network (with C12)

  # --- SMD Electromechanical (see pinout notes in stubs) ---
  POT1: {part: "lcsc:C780220", params: {resistance_ohm: 10000, taper: linear}}  # 3314G-1-103E — 10k SMD trimmer (screwdriver adjust, no knob; linear)
  SW1: {part: "lcsc:C9900021285", params: {current_rating_a: 0.3}}  # MSK-12C02 SMD (SPDT used as SPST)

  # --- Speaker and battery are ENCLOSURE items (wired), same pattern as L1 coil:
  #     off_board + JST PH SMD connector on board (J2/J3) ---
  SPK1: {class: speaker, params: {impedance_ohm: 8, power_w: 0.5}}
  BAT1: {class: connector.battery, params: {voltage_v: 9}}
  J2: {part: "lcsc:C295747", params: {pitch_mm: 2.0}}  # JST PH 2P SMD — speaker
  J3: {part: "lcsc:C295747", params: {pitch_mm: 2.0}}  # JST PH 2P SMD — 9V battery

nets:
  V9V: [BAT1.pos, SW1.a, J3.a]
  V9V_SW: [SW1.b, R1.p1, R3.p1, U1.vs, C11.p1, L1.p2, L2.p2, J1.b]
  GND:
    [
      BAT1.neg, C2.p2, C4.p2, R2.p2, R4.p2, POT1.end_b, U1.gnd, SPK1.neg,
      C5.p2, C11.p2, CT1.p2, U1.in_minus, R6.p2, C13.p2, C14.p2,
      C7.p2, C12.p2, J2.b, J3.b,
    ]

  # --- Search oscillator (Q1, L1 = external coil via J1) — tank at collector:
  #     L1 // (C1 series C2), C9 couples the tank signal to the mixer ---
  SOSC_TANK: [Q1.collector, C1.p1, L1.p1, C9.p1, J1.a]
  SOSC_BASE: [Q1.base, R1.p2, R1B.p1, C13.p1]
  SOSC_EMIT: [Q1.emitter, C1.p2, C2.p1, R2.p1]

  # --- Reference oscillator (Q2, L2 = fixed inductor) — same topology ---
  ROSC_TANK: [Q2.collector, C3.p1, L2.p1, C10.p1]
  ROSC_BASE: [Q2.base, R3.p2, R3B.p1, C14.p1]
  ROSC_EMIT: [Q2.emitter, C3.p2, C4.p1, R4.p1, CT1.p1]

  # --- Mixer + low-pass filter (R6 = anode DC return) ---
  MIX_IN: [D1.anode, C9.p2, C10.p2, R6.p1]
  MIX_OUT: [D1.cathode, R5.p1]
  LPF_OUT: [R5.p2, C5.p1, POT1.end_a]

  # --- Volume + amplifier input ---
  VOL_WIPER: [POT1.wiper, C6.p1]
  AMP_IN: [C6.p2, U1.in_plus]
  AMP_BYPASS: [U1.bypass, C7.p1]
  AMP_OUT: [U1.vout, C8.p1, R7.p1]
  ZOBEL_MID: [R7.p2, C12.p1]  # Zobel in correct series: AMP_OUT -> R7 -> C12 -> GND (previously R7 went direct to GND and C12 floated — caught by W_PART_NOT_IN_ANY_NET)
  SPK_DRIVE: [C8.p2, SPK1.pos, J2.a]

intents:
  - {type: power_rail, net: V9V, voltage_v: 9.0, max_current_a: 0.05}
  - {type: power_rail, net: V9V_SW, voltage_v: 9.0, max_current_a: 0.05}
  - {type: decouples, part: C11, target: U1.vs, max_distance_mm: 5}
  - {type: decouples, part: C7, target: U1.bypass, max_distance_mm: 3}
  - {type: decouples, part: C13, target: Q1.base, max_distance_mm: 5}
  - {type: decouples, part: C14, target: Q2.base, max_distance_mm: 5}
  - {type: analog_sensitive, nets: [SOSC_TANK, SOSC_EMIT, ROSC_TANK, ROSC_EMIT]}
  - {type: analog_sensitive, nets: [MIX_IN, MIX_OUT, LPF_OUT, VOL_WIPER]}

placement_hints:
  - {part: L1, off_board: true}
  - {part: SPK1, off_board: true}   # speaker in enclosure, wired via J2
  - {part: BAT1, off_board: true}   # 9V battery in enclosure, wired via J3
  - {part: U1, region_pref: east}
  - {part: J1, near: Q1, max_distance_mm: 15}
  - {part: J2, near: C8, max_distance_mm: 15}
  - {part: J3, anchor: edge_south}
  - {part: Q2, near: L2, max_distance_mm: 15}
  - {part: CT1, near: Q2, max_distance_mm: 15}
  - {part: POT1, anchor: edge_south}
  - {part: SW1, anchor: edge_south}
